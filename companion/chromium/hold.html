<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JD Turnstile — streaming</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 15px/1.45 system-ui, sans-serif;
        background: #0b1220;
        color: #e8eef7;
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 0.5rem;
        color: #2aa9e0;
      }
      p {
        margin: 0;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Streaming to JDownloader</h1>
      <p>
        CDN navigation was intercepted so the browser does not save the file.
        Keep JDownloader running until the download finishes.
      </p>
    </main>
  </body>
</html>
