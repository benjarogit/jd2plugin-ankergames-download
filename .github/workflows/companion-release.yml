name: Refresh update feeds

# After a GitHub Release with companion assets is published, refresh
# updates/chromium.xml on main.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  refresh-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: ver
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          TAG="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag_full=v${TAG}" >> "$GITHUB_OUTPUT"
          EXT_ID="$(tr -d '[:space:]' < companion/signing/chromium-extension-id.txt)"
          echo "ext_id=${EXT_ID}" >> "$GITHUB_OUTPUT"

      - name: Write update feeds
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          TAG_FULL="${{ steps.ver.outputs.tag_full }}"
          EXT_ID="${{ steps.ver.outputs.ext_id }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG_FULL}"
          mkdir -p updates
          cat > updates/chromium.xml <<EOF
          <?xml version='1.0' encoding='UTF-8'?>
          <gupdate xmlns='http://www.google.com/update2/response' protocol='2.0'>
            <app appid='${EXT_ID}'>
              <updatecheck codebase='${BASE}/jd-turnstile-companion-chromium-${TAG}.crx' version='${TAG}' />
            </app>
          </gupdate>
          EOF
          sed -i 's/^          //' updates/chromium.xml

      - name: Commit feeds
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/chromium.xml
          if git diff --staged --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git commit -m "chore: refresh companion update feeds for ${{ steps.ver.outputs.tag_full }}"
          git push
